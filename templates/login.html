<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7f2" />
    {% include "_theme_init.html" %}
    <title>Sign in · Aranya</title>
    <style>
      :root { color-scheme: light; --page:#f5f7f2; --surface:#fff; --text:#24332d; --muted:#77847d; --line:#e4eae4; --accent:#477b64; --soft:#e8f1eb; }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 15% 5%,#dbe9db,transparent 32rem),var(--page); color:var(--text); font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
      a { color:var(--accent); }
      .card { width:min(100%,440px); padding:clamp(26px,6vw,42px); border:1px solid var(--line); border-radius:24px; background:var(--surface); box-shadow:0 24px 70px #30443712; }
      .brand { display:flex; align-items:center; gap:10px; margin-bottom:32px; color:var(--text); font-size:1.12rem; font-weight:700; text-decoration:none; }
      .mark { display:grid; width:38px; height:38px; place-items:center; border-radius:13px; background:var(--soft); color:var(--accent); }
      h1 { margin:0; font:500 clamp(1.9rem,5vw,2.4rem)/1.15 Georgia,serif; letter-spacing:-.04em; }
      .intro { margin:10px 0 26px; color:var(--muted); }
      label { display:block; margin:16px 0 6px; font-size:.88rem; font-weight:650; }
      input { width:100%; min-height:48px; padding:10px 13px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text); font:inherit; }
      input:focus { outline:3px solid #477b6422; border-color:var(--accent); }
      button { width:100%; min-height:48px; margin-top:22px; border:0; border-radius:12px; background:var(--accent); color:white; font:inherit; font-weight:650; cursor:pointer; }
      button:hover { background:#386a54; }
      .error { margin:18px 0 0; padding:12px 14px; border:1px solid #efc9c5; border-radius:12px; background:#fff4f2; color:#873f38; }
      .foot { margin:23px 0 0; color:var(--muted); text-align:center; font-size:.9rem; }
      .foot a { font-weight:650; }
      .brand-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; }
      .brand-row .brand { margin:0; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="brand-row">
        <a class="brand" href="/">
          <span class="mark" aria-hidden="true">✳</span><span>aranya</span>
        </a>
        {% include "_theme_toggle.html" %}
      </div>
      <h1>Welcome back.</h1>
      <p class="intro">Sign in to continue to your private space.</p>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required />
        <button type="submit">Sign in</button>
      </form>
      <p class="foot">New to Aranya? <a href="{{ url_for('register') }}">Create an account</a></p>
    </main>
  </body>
</html>
